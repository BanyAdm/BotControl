name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:  # lets you trigger manually from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive

      - name: Download & upload APK as artifact
        run: |
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(JSON.parse(d)[0].artifacts.buildUrl)")
          curl -L "$URL" -o BotControl.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BotControl.apk
          path: BotControl.apk
          retention-days: 30
